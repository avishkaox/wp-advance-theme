version: '3'

services:
  db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - "3099:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: advancetheme
      MYSQL_USER: seduser
      MYSQL_PASSWORD: z7xcna7RXPu8hWScB52r
    networks:
      - wpsite

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_USER: seduser
      MYSQL_PASSWORD: z7xcna7RXPu8hWScB52r
      UPLOAD_LIMIT: 500000000MB
    ports:
      - 8561:80
    networks:
     - wpsite     

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    volumes:
      - ./:/var/www/html
      - ./uploads.ini:/usr/local/etc/php/conf.d/php.ini
    ports:
      - "8001:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: seduser
      WORDPRESS_DB_PASSWORD: z7xcna7RXPu8hWScB52r
      WORDPRESS_DB_NAME: advancetheme
      WORDPRESS_TABLE_PREFIX: wp_r7dswo_
    
    networks:
      - wpsite
      

networks:
  wpsite:

volumes:
  db_data: